<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Watad;src:url(watad.otf)}
@font-face{font-family:Zain;src:url(zain-vf.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a1522}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 78% 22%,#16314f 0%,#0a1522 62%);font-family:Watad,Zain;color:#f2e9d0}
.flutes{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(207,168,83,.07) 0 2px,transparent 2px 62px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.ghost{position:absolute;width:1300px;left:-130px;top:330px;opacity:.07}
.mid{position:absolute;left:0;right:0;top:640px;text-align:center}
.mark{width:230px;display:block;margin:0 auto}
.n{font-size:112px;line-height:1.2;margin-top:48px;color:#f2e9d0}
.t{font-size:64px;color:#ecc77a;margin-top:6px}
.rule{width:220px;height:4px;background:#cfa853;margin:56px auto 40px;position:relative}
.rule:after{content:"";position:absolute;left:50%;top:-8px;width:20px;height:20px;background:#cfa853;transform:translateX(-50%) rotate(45deg)}
.en{font-family:Zain;font-weight:600;font-size:34px;letter-spacing:9px;color:#cfa853;direction:ltr}
.u{font-family:Zain;font-weight:600;font-size:40px;letter-spacing:4px;color:#f2e9d0;margin-top:34px;direction:ltr}
.frame{position:absolute;inset:60px;border:1.5px solid rgba(207,168,83,.35)}
</style></head><body><div class="c"><div class="flutes"></div><img class="ghost" src="logo-mark.png"><div class="frame"></div>
<div class="mid"><img class="mark" src="logo-mark.png"><div class="n">تركي النايف وشركاؤه</div><div class="t">للمحاماة والاستشارات القانونية</div><div class="rule"></div><div class="en">TURKI ALNAIF &amp; PARTNERS</div><div class="u">taap.sa</div></div></div></body></html>
