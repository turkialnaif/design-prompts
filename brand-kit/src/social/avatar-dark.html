:root{--ink:#0b1626;--ink2:#14263d;--gold:#d0a751;--gs:#e6c988;--gl:#f6e2b3;--gd:#a9843c;--cream:#faf6ec}

.rq{font-family:'Aref Ruqaa',serif}
.gold{color:var(--gl)}
